id: rss-feed
name: RSS / Atom feeds
version: 1.0.0
runtime:
  builtin: rss
  lifecycle: keepalive
  limits: {memory_mb: 128, cpu_percent: 20}
contributes:
  triggers:
    - id: new_item
      kind: rss
      title: New feed item
      config_schema:
        type: object
        required: [url]
        properties:
          url: {type: string, title: Feed URL, maxLength: 2000, x-order: 1}
          interval_minutes: {type: integer, title: Poll every (minutes), minimum: 5, maximum: 1440, default: 30, x-order: 2}
          max_items: {type: integer, title: Max items per poll, minimum: 1, maximum: 50, default: 10, x-order: 3}
  connectors:
    - id: feeds
      side_effects: false
      mcp: {builtin: rss}
permissions:
  network: ["*"]
  host_api: [log.write]
