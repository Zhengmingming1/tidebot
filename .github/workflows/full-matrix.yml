name: full matrix
# The 3-OS test matrix. ci.yml calls it on every push/PR to main, release.yml calls it
# for every v* tag before anything is packaged, and it can be run by hand from the
# Actions tab / `gh workflow run full-matrix.yml -f ref=<branch|tag|sha>`.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "branch, tag or SHA to test (default: the selected branch)"
        required: false
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: read

jobs:
  i18n:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: zh-CN / en key parity
        run: python3 scripts/check-i18n.py
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: secret scan (gitleaks, full history)
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner .

  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: vet
        run: go vet ./...
      - name: test
        shell: bash
        run: |
          chmod +x testdata/mock-claude/claude
          go test -count=1 ./...
      - name: build
        shell: bash
        run: |
          CGO_ENABLED=0 go build -o bin/ ./cmd/agentd ./cmd/agentctl
          ls -l bin
      - name: self-update end to end (local signed feed, throwaway key)
        if: runner.os == 'Linux'
        run: bash scripts/e2e-update.sh

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: cmd/tidebot-desktop/go.mod
          cache-dependency-path: cmd/tidebot-desktop/go.sum
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: test + build
        working-directory: cmd/tidebot-desktop
        shell: bash
        run: |
          TAGS=""; [ "$RUNNER_OS" = Linux ] && TAGS="-tags gtk3"
          go vet $TAGS ./...
          go test $TAGS ./...
          go build $TAGS -o /tmp/tidebot-desktop-ci .
