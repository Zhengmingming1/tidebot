name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to (re)build, e.g. v0.1.0"
        required: true

# Least privilege: read by default, each job asks for what it needs.
permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # Stamped into release binaries (buildinfo.Official): only these may self-update.
  TIDEBOT_OFFICIAL: "1"

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # The full 3-OS test matrix must pass before any (10x-billed macOS) packaging starts.
  test:
    uses: ./.github/workflows/full-matrix.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref_name }}

  server:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: bash scripts/package-server.sh "${TAG#v}" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server
          path: dist/*

  desktop-linux:
    needs: test
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: cmd/tidebot-desktop/go.mod
          cache-dependency-path: cmd/tidebot-desktop/go.sum
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev file libfuse2
      - run: bash scripts/package-desktop-linux.sh "${TAG#v}" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.os }}
          path: dist/*

  desktop-macos:
    needs: test
    # Signing secrets live in the "release" environment (deployments limited to v* tags / main).
    environment: release
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: cmd/tidebot-desktop/go.mod
          cache-dependency-path: cmd/tidebot-desktop/go.sum
      - name: import signing certificate (optional)
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        if: env.APPLE_CERT_P12_BASE64 != ''
        run: |
          KC="$RUNNER_TEMP/build.keychain"; PW="$(openssl rand -hex 16)"
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$PW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$PW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PW" "$KC"
          security list-keychains -d user -s "$KC"
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: build .app + .dmg
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/package-desktop-macos.sh "${TAG#v}" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-macos
          path: dist/*

  desktop-windows:
    needs: test
    environment: release
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: cmd/tidebot-desktop/go.mod
          cache-dependency-path: cmd/tidebot-desktop/go.sum
      - name: build
        run: |
          V="${TAG#v}"
          mkdir -p stage dist
          (cd cmd/tidebot-desktop && go run github.com/tc-hib/go-winres@v0.3.3 simply --icon ../../packaging/windows/tidebot.ico --product-name tidebot --file-description tidebot)
          (cd cmd/tidebot-desktop && go build -trimpath -ldflags "-s -w -H windowsgui -X github.com/Zhengmingming1/tidebot/internal/buildinfo.Version=$V -X github.com/Zhengmingming1/tidebot/internal/buildinfo.Commit=${GITHUB_SHA::7} -X github.com/Zhengmingming1/tidebot/internal/buildinfo.Official=$TIDEBOT_OFFICIAL" -o ../../stage/tidebot-desktop.exe .)
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/Zhengmingming1/tidebot/internal/buildinfo.Version=$V -X github.com/Zhengmingming1/tidebot/internal/buildinfo.Official=$TIDEBOT_OFFICIAL" -o stage/agentctl.exe ./cmd/agentctl
      - name: install NSIS if missing
        run: command -v makensis || choco install nsis -y --no-progress
      - name: sign binaries (optional)
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        if: env.WINDOWS_CERT_PFX_BASE64 != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $st = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $st.FullName sign /f "$env:RUNNER_TEMP\cert.pfx" /p "$env:WINDOWS_CERT_PASSWORD" /fd sha256 /tr http://timestamp.digicert.com /td sha256 stage\tidebot-desktop.exe stage\agentctl.exe
          Remove-Item "$env:RUNNER_TEMP\cert.pfx"
      - name: installer
        run: |
          V="${TAG#v}"
          NSIS="$(command -v makensis || echo '/c/Program Files (x86)/NSIS/makensis.exe')"
          "$NSIS" -DVERSION="$V" -DSRC="$(cygpath -w "$PWD/stage")" -DOUTFILE="$(cygpath -w "$PWD/dist/tidebot-desktop-${V}-Windows-x64-Setup.exe")" packaging/windows/installer.nsi
      - name: sign installer (optional)
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        if: env.WINDOWS_CERT_PFX_BASE64 != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $st = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $st.FullName sign /f "$env:RUNNER_TEMP\cert.pfx" /p "$env:WINDOWS_CERT_PASSWORD" /fd sha256 /tr http://timestamp.digicert.com /td sha256 (Get-ChildItem dist\*.exe).FullName
          Remove-Item "$env:RUNNER_TEMP\cert.pfx"
      - name: portable zip (used by the in-app updater)
        shell: pwsh
        run: |
          $V = "$env:TAG".TrimStart("v")
          Compress-Archive -Path stage\tidebot-desktop.exe, stage\agentctl.exe -DestinationPath "dist\tidebot-desktop-$V-Windows-x64.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-windows
          path: dist/*

  docker:
    needs: test
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/tidebot" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/Zhengmingming1/tidebot-releases
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}

  publish:
    needs: [server, desktop-linux, desktop-macos, desktop-windows, docker]
    # UPDATE_SIGNING_KEY + RELEASES_TOKEN: environment "release" (v* tags / main only).
    environment: release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: "{server,desktop-*}"
          merge-multiple: true
      - name: stable "latest" aliases for the desktop files
        run: |
          # versionless copies so README links can use releases/latest/download/<name>
          cd dist
          for f in tidebot-desktop-*-macOS-AppleSilicon-Intel.dmg tidebot-desktop-*-Windows-x64-Setup.exe tidebot-desktop-*-Linux-x64.AppImage tidebot-desktop-*-Linux-x64.deb; do
            [ -f "$f" ] && cp "$f" "$(echo "$f" | sed -E 's/^tidebot-desktop-[^-]+-/tidebot-desktop-/')"
          done
          ls -l
      - name: checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt
      - name: notes
        run: bash scripts/release-notes.sh "$TAG" "${{ github.repository }}" > notes.md
      - name: create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --title "tidebot $TAG" --notes-file notes.md
          fi

      # Public mirror: Zhengmingming1/tidebot-releases gets the same files plus
      # SHA256SUMS and a signed latest.json for the in-app updater (the update channel).
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: signed update manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        if: env.UPDATE_SIGNING_KEY != ''
        run: |
          bash scripts/release-notes.sh "$TAG" Zhengmingming1/tidebot-releases > public-notes.md
          go run ./tools/relsign manifest "$TAG" dist public-notes.md
      - name: publish to tidebot-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        if: env.GH_TOKEN != ''
        run: |
          R=Zhengmingming1/tidebot-releases
          test -f dist/latest.json || { echo "latest.json missing (UPDATE_SIGNING_KEY not set?)"; exit 1; }
          if gh release view "$TAG" -R "$R" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* -R "$R" --clobber
            gh release edit "$TAG" -R "$R" --notes-file public-notes.md
          else
            gh release create "$TAG" dist/* -R "$R" --title "tidebot $TAG" --notes-file public-notes.md --latest
          fi
      - name: note when the public mirror is skipped
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        if: env.GH_TOKEN == ''
        run: echo "::warning::RELEASES_TOKEN not set; skipped publishing to tidebot-releases"
