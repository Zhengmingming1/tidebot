name: ci
# Main and Context Planner branch pushes run the full matrix without requiring a PR.
# Every PR also runs the full Linux/macOS/Windows matrix (defined once in
# full-matrix.yml, which release.yml also runs before packaging a v* tag).

on:
  push:
    branches: [main, "feat/context-planner-*"]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "README.en.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "README.en.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    uses: ./.github/workflows/full-matrix.yml
