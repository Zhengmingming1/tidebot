name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: |
          chmod +x testdata/mock-claude/claude
          go test ./...
      - name: Build
        run: |
          CGO_ENABLED=0 go build -o bin/agentd ./cmd/agentd
          CGO_ENABLED=0 go build -o bin/agentctl ./cmd/agentctl
