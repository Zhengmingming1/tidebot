# Desktop shell build. Kept in docs/ci because the push token has no `workflow` scope;
# copy to .github/workflows/ to enable. Windows and macOS jobs are UNTESTED.
name: desktop
on: [push, pull_request]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25.3' }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: test
        working-directory: cmd/tidebot-desktop
        shell: bash
        run: |
          TAGS=""; [ "$RUNNER_OS" = Linux ] && TAGS="-tags gtk3"
          go test $TAGS ./...
      - name: build
        shell: bash
        run: |
          case "$RUNNER_OS" in Linux) T=linux;; Windows) T=windows;; macOS) T=darwin;; esac
          GOTOOLCHAIN=local scripts/build-desktop.sh $T dist
      - uses: actions/upload-artifact@v4
        with: { name: tidebot-desktop-${{ matrix.os }}, path: dist/ }
